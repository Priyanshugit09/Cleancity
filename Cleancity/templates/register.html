<!DOCTYPE html>
<html>
<head>
    <title>Register - CleanCity</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>📝 Create Account</h1>

    <p class="subtitle">
        Join CleanCity and help build a cleaner, healthier city.
    </p>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="👤 Full Name"
            required>

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="📧 Email Address"
            required>

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="🔒 Password"
            required>

        <br><br>

        <button type="submit" class="btn">
            ✅ Create Account
        </button>

    </form>

    <br>

    <a href="/" class="btn">
        🏠 Home
    </a>

    <p style="margin-top:20px;">
        Already have an account?
        <a href="/login"><b>Login</b></a>
    </p>

</div>

</body>
</html>
