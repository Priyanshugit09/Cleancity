<!DOCTYPE html>
<html>

<head>

    <title>Admin Login - CleanCity</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>🛡️ Admin Login</h1>

    <p class="subtitle">
        Authorized personnel only.
    </p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="👤 Username"
            required>

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="🔒 Password"
            required>

        <br><br>

        <button type="submit" class="btn">
            🔐 Login
        </button>

    </form>

    <br>

    <a href="/" class="btn">
        🏠 Home
    </a>

</div>

</body>

</html>
