<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Complaint | CleanCity</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-page">

<div class="container complaint-container">

    <h1>Register Complaint</h1>

    <p class="subtitle">
        Help us keep your city clean by reporting garbage issues.
    </p>

    <form method="POST" enctype="multipart/form-data">

        <input
            type="text"
            name="area"
            placeholder="Area / Location"
            required>

        <textarea
            name="description"
            rows="5"
            placeholder="Describe the garbage problem..."
            required></textarea>

        <input
            type="file"
            name="image"
            accept="image/*"
            required>

        <button type="submit" class="btn">
            Submit Complaint
        </button>

    </form>

    <div class="extra-links">

        <a href="/dashboard" class="home-link">
            ← Back to Dashboard
        </a>

    </div>

    </div>
</body>
</html>
